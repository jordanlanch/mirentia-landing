# Mirentia landing — static site behind nginx, on Dokploy.
#
# The image is BUILT here rather than running the stock nginx image with
# bind mounts, because:
#   1. /etc/nginx/conf.d/default.conf is a symlink in the official nginx
#      image, so neither a bind mount nor a COPY can target it.
#   2. The site config is a TEMPLATE: the nginx entrypoint envsubsts it at
#      boot so $API_UPSTREAM reaches proxy_pass. That only works for files
#      under /etc/nginx/templates/, which is a copy-time concern, not a
#      mount-time one.
#   3. Baking the site means Dokploy needs nothing but the git repo.
#
# API_UPSTREAM points at the Go backend. Until that backend is deployed the
# proxy answers 502 and the capture form falls back to its WhatsApp
# message — the page still renders, it just cannot capture.

services:
  landing:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-mirentia-api:8080}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s