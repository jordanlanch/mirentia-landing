# Mirentia landing — produccion (Dokploy).
#
# El sitio es estatico: nginx sirve los archivos horneados en la imagen
# jordanlanch/mirentia-landing (ver website/Dockerfile).
#
# La unica pieza dinamica es el proxy /api/ hacia el backend Go, para que el
# form del funnel POSTe a /api/funnel/capture en el mismo origen (lo que el
# CSP del sitio ya asume con connect-src 'self'). El destino se inyecta por
# variable de entorno: la config de nginx va como TEMPLATE y la renderiza el
# entrypoint de la imagen oficial (ver docker-nginx.conf.template).
#
# API_UPSTREAM es el alias de red "mirentia-backend" que define el compose del
# backend. NO puede llamarse igual que un servicio de Traefik: Traefik arma un
# servicio por cada alias, con el puerto EXPOSE de la imagen, y ese le gana al
# del label, dejando el router apuntando a un puerto donde nadie escucha.
#
# VALORES LITERALES, sin ${...}: el compose raw de Dokploy no interpola y el
# valor llega literal al contenedor. Ademas el template de nginx se renderiza
# en el contenedor con envsubst, y un placeholder ahi queda metido en la config
# de nginx: nginx no arranca ("the closing bracket in API_UPSTREAM variable is
# missing"), el contenedor queda en crash-loop y el router se queda sin
# backend, que es un 404 sin cuerpo para cada visitante.
#
# Para publicar un cambio del sitio:
#   cd website
#   TAG="prod-$(date -u +%Y-%m-%d)-$(git rev-parse --short HEAD)"
#   docker build -t "jordanlanch/mirentia-landing:$TAG" .
#   docker push "jordanlanch/mirentia-landing:$TAG"
#   # y actualizar IMAGE aca y redeployar.
#
# El loop local usa docker-compose.dev.yml.

networks:
  dokploy-network:
    external: true
    name: dokploy-network

services:
  landing:
    image: jordanlanch/mirentia-landing:prod-2026-10-21-914a263-r2
    pull_policy: always
    restart: unless-stopped
    # NO published port on purpose. Dokploy's Traefik reaches the container
    # over the docker network, and publishing any host port is a liability:
    # a conflict with an existing service kills the landing (the site goes
    # down) and nothing else.
    expose:
      - "80"
    environment:
      API_UPSTREAM: mirentia-backend:8090
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      # La red explicita: es lo que hacen los composes que rutean bien en
      # esta instancia (omnirouter, bailante-web).
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.mirentia-landing.rule=Host(`mirentia.com`) || Host(`www.mirentia.com`)"
      - "traefik.http.routers.mirentia-landing.service=mirentia-landing"
      - "traefik.http.routers.mirentia-landing.entrypoints=websecure"
      - "traefik.http.routers.mirentia-landing.tls.certresolver=letsencrypt"
      - "traefik.http.services.mirentia-landing.loadbalancer.server.port=80"
# ponytail: single static page, no CMS. Add CMS when copy needs to change weekly.
